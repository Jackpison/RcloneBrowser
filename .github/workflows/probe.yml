name: probe-qt (temporary)
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - shell: pwsh
        run: |
          python -m pip install -q "aqtinstall==3.3.*"
          $v = (python -m aqt list-qt windows desktop) -join " "
          Write-Output "::notice title=versions::$v"
          foreach ($q in @("6.11.0","6.10.1","6.10.0")) {
            $a = (python -m aqt list-qt windows desktop --arch $q 2>&1) -join " "
            Write-Output "::notice title=arch $q::$a"
          }
