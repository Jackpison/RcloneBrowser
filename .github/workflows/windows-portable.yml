name: Windows portable

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # for publishing releases on tags

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Assemble portable folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = (Get-Content VERSION -First 1).Trim()
          $dir = "dist\RcloneBrowser"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item build\build\RcloneBrowser.exe $dir

          windeployqt --release --no-translations --no-system-d3d-compiler `
                      --no-opengl-sw --no-compiler-runtime "$dir\RcloneBrowser.exe"

          # App-local VC++ runtime: the folder runs on a clean Windows install.
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          Copy-Item "$($crt.FullName)\*.dll" $dir

          # Bundle the latest official rclone, checksum-verified.
          $tag = (Invoke-WebRequest -Uri https://downloads.rclone.org/version.txt -UseBasicParsing).Content.Trim() -replace '^rclone\s+',''
          $zip = "rclone-$tag-windows-amd64.zip"
          Invoke-WebRequest "https://downloads.rclone.org/$tag/$zip" -OutFile $zip
          Invoke-WebRequest "https://downloads.rclone.org/$tag/SHA256SUMS" -OutFile SHA256SUMS
          $expected = (Select-String -Path SHA256SUMS -Pattern "^([0-9a-f]{64})\s+$([regex]::Escape($zip))$").Matches[0].Groups[1].Value
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "rclone checksum mismatch" }
          Expand-Archive $zip -DestinationPath rclone-x
          New-Item -ItemType Directory -Force "$dir\rclone" | Out-Null
          Copy-Item (Get-ChildItem rclone-x -Recurse -Filter rclone.exe).FullName "$dir\rclone\"

          # Presence of RcloneBrowser.ini switches on portable mode. Paths are
          # relative to the exe, so the folder can live anywhere (USB stick...).
          @"
          [Settings]
          rclone=rclone/rclone.exe
          checkRcloneUpdates=true
          "@ -replace '(?m)^\s+','' | Set-Content -Encoding ascii "$dir\RcloneBrowser.ini"

          Copy-Item README.md, LICENSE, CHANGELOG.md $dir
          Compress-Archive "$dir" "dist\RcloneBrowser-$ver-windows-x64-portable.zip"
          "VERSION=$ver" | Out-File -Append $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: RcloneBrowser-${{ env.VERSION }}-windows-x64-portable
          path: dist/RcloneBrowser

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
