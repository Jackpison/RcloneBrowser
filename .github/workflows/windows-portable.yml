name: Windows portable

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: read-only unless a step needs more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write # publishing the release on version tags
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # aqtinstall (used to install Qt) needs compression libraries that may not
      # have packages for the very newest Python yet, so pin a known-good one.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          # Exact version for reproducible builds. 6.10.3 is the newest Qt the
          # installer (aqtinstall 3.3) can read; 6.11+ metadata is not
          # supported by it yet.
          version: "6.10.3"
          arch: win64_msvc2022_64
          setup-python: false
          cache: true

      - name: Configure, build and test
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build build || exit /b 1
          ctest --test-dir build --output-on-failure || exit /b 1

      - name: Assemble portable folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = (Get-Content VERSION -First 1).Trim()
          $dir = "dist\RcloneBrowser"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item build\build\RcloneBrowser.exe $dir

          # Qt plugins go into qt\plugins (found via qt.conf) instead of seven
          # folders next to the exe; plugin types the app does not use are
          # skipped. Qt and VC++ DLLs must stay next to the exe: Windows loads
          # them before any app code runs.
          windeployqt --release --no-translations --no-system-d3d-compiler `
                      --no-opengl-sw --no-compiler-runtime `
                      --skip-plugin-types styles,generic,networkinformation `
                      --plugindir "$dir\qt\plugins" "$dir\RcloneBrowser.exe"
          @(
            "[Paths]"
            "Plugins = qt/plugins"
          ) | Set-Content -Encoding ascii "$dir\qt.conf"

          # App-local VC++ runtime: the folder runs on a clean Windows install.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Where-Object { $_.Name -match '^\d' } | Sort-Object Name -Descending | Select-Object -First 1
          $crt = Get-ChildItem "$($redist.FullName)\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          Copy-Item "$($crt.FullName)\*.dll" $dir

          # Bundle the latest official rclone, checksum-verified.
          $tag = (Invoke-WebRequest -Uri https://downloads.rclone.org/version.txt -UseBasicParsing).Content.Trim() -replace '^rclone\s+',''
          $zip = "rclone-$tag-windows-amd64.zip"
          Invoke-WebRequest "https://downloads.rclone.org/$tag/$zip" -OutFile $zip
          Invoke-WebRequest "https://downloads.rclone.org/$tag/SHA256SUMS" -OutFile SHA256SUMS
          $expected = (Select-String -Path SHA256SUMS -Pattern "^([0-9a-f]{64})\s+$([regex]::Escape($zip))$").Matches[0].Groups[1].Value
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "rclone checksum mismatch" }
          Expand-Archive $zip -DestinationPath rclone-x
          New-Item -ItemType Directory -Force "$dir\rclone" | Out-Null
          Copy-Item (Get-ChildItem rclone-x -Recurse -Filter rclone.exe).FullName "$dir\rclone\"

          # Presence of RcloneBrowser.ini switches on portable mode. Paths are
          # relative to the exe, so the folder can live anywhere (USB stick...).
          @(
            "[Settings]"
            "rclone=rclone/rclone.exe"
            "checkRcloneUpdates=true"
          ) | Set-Content -Encoding ascii "$dir\RcloneBrowser.ini"

          # remote logos shipped by default (users can add or replace files)
          New-Item -ItemType Directory -Force "$dir\icons\remotes" | Out-Null
          Copy-Item icons\remotes\*.png "$dir\icons\remotes\"
          Copy-Item docs\remote-icons.md "$dir\icons\remotes\README.md"
          New-Item -ItemType Directory -Force "$dir\docs" | Out-Null
          Copy-Item README.md, LICENSE, CHANGELOG.md, docs\Rclone-Browser-Guide.pdf "$dir\docs\"

          # Smoke test of the packaged folder: the app must start with this
          # layout (platform plugin via qt.conf, image formats, TLS).
          $p = Start-Process -FilePath "$dir\RcloneBrowser.exe" -ArgumentList "--selftest" `
                 -PassThru -NoNewWindow -RedirectStandardOutput selftest.txt
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "self-test timed out" }
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          Compress-Archive "$dir" "dist\RcloneBrowser-$ver-windows-x64.zip"
          (Get-FileHash "dist\RcloneBrowser-$ver-windows-x64.zip" -Algorithm SHA256).Hash.ToLower() + "  RcloneBrowser-$ver-windows-x64.zip" | Set-Content -Encoding ascii "dist\SHA256SUMS.txt"
          # Release notes: this version's section of CHANGELOG.md
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($ver))\][^\n]*\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md for details." }
          $notes += "`n`n---`n**Download** ``RcloneBrowser-$ver-windows-x64.zip``, extract it anywhere and run ``RcloneBrowser.exe``. SHA-256 checksums are in ``SHA256SUMS.txt``."
          Set-Content -Encoding utf8 dist\release-notes.md $notes
          "VERSION=$ver" | Out-File -Append $env:GITHUB_ENV

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RcloneBrowser-${{ env.VERSION }}-windows-x64
          path: dist/RcloneBrowser

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Rclone Browser ${{ env.VERSION }}
          body_path: dist/release-notes.md
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
